[project]
site_name = "歪歪空间"
site_url = "https://yuumixcode.github.io/"
site_description = "Yuumix Code - 个人知识库/数字花园。"
site_author = "yuumixcode"
docs_dir = "docs"
site_dir = "site"
copyright = "Copyright &copy; 2026 yuumixcode"
extra_css = [
    "stylesheets/extra.css",
    "https://fontsapi.zeoseven.com/292/main/result.css",  # 霞鹜文楷 LXGW WenKai(zeoseven CDN,中英文都用它)
    "https://fonts.font.im/css2?family=JetBrains+Mono:wght@400;500;700&display=swap",  # JetBrains Mono 代码字体(font.im 反代 Google Fonts,国内可用)
    "https://fonts.font.im/css2?family=Press+Start+2P&family=VT323&display=swap",  # 像素字体(Press Start 2P 标题 + VT323 对白)
]

# 导航规范:Header 显示中文(品牌/工具名保留英文),内部页面按需展开
nav = [
    { "首页" = "index.md" },
    { "博客" = ["blog/index.md"] },
    { "Aesir Packages" = [
        # Aesir Architecture / Aesir Modules 文档已迁移至独立文档站,nav 仅留外链钩子
        { "Aesir Framework 文档站" = "https://yuumixcode.github.io/AesirFramework-Docs/" },
        { "Aesir Inspector" = [
            "aesir-inspector/index.md",
            "aesir-inspector/bilingual-odin.md",
            "aesir-inspector/examples.md",
            "aesir-inspector/safe-utilities.md",
            "aesir-inspector/script-doc-generator.md",
            "aesir-inspector/summary-tool.md",
        ] },
    ] },
    { "Unity" = [
        {"杂项" = [
            "unity-knowledge/misc/mac-and-windows-git-collaboration-unity.md",
            "unity-knowledge/misc/ssh-publickey-auth-failure-debug.md",
        ]},
        { "Localization" = [
            "unity-knowledge/unity-packages/localization/unity-localization-pitfall-log.md",
            "unity-knowledge/unity-packages/localization/localization-question.md",
        ] },
        { "Addressables" = "unity-knowledge/unity-packages/addressables/addressable-faq.md" },
        { "Dependency Injection" = [
            "unity-knowledge/dependency-injection/index.md",
            "unity-knowledge/dependency-injection/reflex-video-note.md",
            "unity-knowledge/dependency-injection/usyrup-repo-note.md",
        ] },
        { "Plugins" = [
            "unity-knowledge/plugins/feel/feel-rotation-spring-tutorial.md",
        ] },
    ] },
    { "Zensical" = [
        "zensical/index.md",
        { "添加视频指南" = "zensical/add-video.md" },
        { "自定义字体指南" = "zensical/custom-fonts.md" },
    ] },
    { "AI" = [
        "ai/index.md",
        "ai/bento-presentation-guide.md",
        "ai/personal-ip-generator-guide.md",
        "ai/voice-clone-tts-guide.md",
    ] },
]

# 插件:Blog 为 Zensical 0.0.65+ 内置,无需额外安装;文章源在 docs/blog/posts/
# post_date_format 用的是 ICU 风格模式(非 strftime):y=年 M=月 d=日 H=24时 a=AM/PM E=星期,
# 默认不按站点语言本地化(中文站会输出 September 30, 2026 / Wednesday),故显式写成中文
[project.plugins.blog]
post_date_format = "y年M月d日"

[project.theme]
variant = "modern"
language = "zh"
# custom_dir = "overrides"  # 首页内容已迁入 docs/index.md,模板覆盖已移除;如需其他 override 再启用
favicon = "assets/images/avatar.png"  # favicon 用 GitHub 头像 PNG(从 https://github.com/yuumixcode.png 拉取,256×256)
logo = "assets/images/avatar.svg"  # 站点左上角 logo 用 SVG(由 avatar.png 通过 tools/png_to_svg.py 转出,2D 矩形合并,矢量缩放无损)
# 备注:主题对 logo 格式无硬性要求(走 <img src>),SVG 仅因为更轻 + 任意尺寸锐利
# 暗色模式如需切换 logo,加 [project.theme.alternate] 即可
features = [
    "navigation.instant",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "content.code.copy",
]
