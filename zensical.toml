[project]
site_name = "Yuumix Code Website"
site_url = "https://yuumixcode.github.io/"
site_description = "Yuumix Code - 个人知识库/数字花园。"
site_author = "yuumixcode"
docs_dir = "docs"
site_dir = "site"
copyright = "Copyright &copy; 2026 yuumixcode"
extra_css = ["stylesheets/extra.css"]

# 导航规范:Header 显示中文(品牌/工具名保留英文),内部页面按需展开
nav = [
    { "首页" = "index.md" },
    { "Aesir Architecture" = [
        "aesir-architecture/index.md",
        "aesir-architecture/architecture.md",
        "aesir-architecture/quick-start.md",
        "aesir-architecture/roadmap.md",
    ] },
    { "Aesir Modules" = "aesir-modules/index.md" },
    { "Aesir Inspector" = [
        "aesir-inspector/index.md",
        "aesir-inspector/bilingual-odin.md",
        "aesir-inspector/examples.md",
        "aesir-inspector/safe-utilities.md",
        "aesir-inspector/script-doc-generator.md",
        "aesir-inspector/summary-tool.md",
    ] },
    { "Odin Inspector" = [
        "odin-inspector/getting-started.md",
        "odin-inspector/serialization.md",
        "odin-inspector/attributes.md",
        "odin-inspector/drawer.md",
        "odin-inspector/editor-window.md",
        "odin-inspector/cases.md",
        "odin-inspector/pitfalls.md",
    ] },
    { "Unity" = [
        { "Localization" = [
            "unity-knowledge-base/localization/unity-localization-pitfall-log.md",
            "unity-knowledge-base/localization/localization-question.md",
            "unity-knowledge-base/localization/slides/index.md",
        ] },
        { "Addressables" = "unity-knowledge-base/addressables/addressable-faq.md" },
    ] },
    { "Zensical" = [
        "zensical/index.md",
        "zensical/add-video.md",
        "zensical/custom-fonts.md",
    ] },
]

[project.theme]
variant = "modern"
language = "zh"
features = [
    "navigation.instant",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "content.code.copy",
]
